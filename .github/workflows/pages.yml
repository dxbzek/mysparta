name: Deploy to GitHub Pages

# NOTE: runs are manual-only until GitHub Pages is enabled for this repo
# (Settings → Pages → Source: "GitHub Actions"). Once enabled, trigger it
# from the Actions tab ("Run workflow") — or restore the push trigger below
# so every push deploys automatically:
#
#   push:
#     branches: ["claude/browser-rpg-mybrute-inspired-4f0zmj"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json's "packageManager" field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agoge/web build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
